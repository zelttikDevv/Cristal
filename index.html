<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cristal ✨</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@200;400&display=swap" rel="stylesheet">
</head>
<body>

    <div id="global-stars"></div>

    <section id="lock-screen">
        <div class="lock-container">
            <p id="dynamic-hint">Son 3 números</p>
            <div class="inputs">
                <input type="number" class="code-input" maxlength="1" inputmode="numeric">
                <input type="number" class="code-input" maxlength="1" inputmode="numeric">
                <input type="number" class="code-input" maxlength="1" inputmode="numeric">
            </div>
            <button id="unlock-btn">UNLOCK</button>
        </div>
    </section>

    <div id="loader-container" class="hidden">
        <div class="loader-bar"><div id="progress"></div></div>
        <p class="loading-text">Sincronizando...</p>
    </div>

    <div id="universe-container" class="hidden">
        <div id="spiral-galaxy"></div>
    </div>

    <div id="zoom-hint" class="hidden">Eventualmente todo lo que es para ti termina encontrándote...</div>

    <audio id="innerbloom-audio" loop>
        <source src="innerbloom.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
