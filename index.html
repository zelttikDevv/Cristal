<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ella ✨</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@200&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Pantalla de Bloqueo -->
    <section id="lock-screen">
        <div class="lock-container">
            <p>La única pista que tienes para desbloquear esto son 3 números</p>
            <div class="inputs">
                <input type="number" id="d1" class="code-input" maxlength="1">
                <input type="number" id="d2" class="code-input" maxlength="1">
                <input type="number" id="d3" class="code-input" maxlength="1">
            </div>
            <button id="unlock-btn">ENTRAR</button>
        </div>
    </section>

    <!-- Escenario 3D -->
    <canvas id="galaxy-canvas"></canvas>
    <div id="zoom-hint" class="hidden">Usa el scroll para viajar por nuestra galaxia...</div>

    <!-- Audio -->
    <audio id="innerbloom-audio" loop>
        <source src="innerbloom.mp3" type="audio/mpeg">
    </audio>

    <!-- Librerías Externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <!-- Tu Lógica -->
    <script src="script.js"></script>
</body>
</html>
